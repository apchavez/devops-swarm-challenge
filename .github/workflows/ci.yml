name: CI

# Mirrors the "Cloud" half of reto.png: Build Code -> Unit Test -> Code analysis
# -> GitHub Advanced Security (see codeql.yml) -> Fluid Attacks (Semgrep SAST here,
# documented equivalent - see README) -> Quality Gate Sonar -> JFrog Artifactory
# (also substituted - see README: JFrog's trial rejects personal-email signups,
# so this uses GitHub Container Registry instead, same "push the image to a
# registry" step with zero external account needed).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  build-test:
    name: Build Code + Unit Test + Code analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint and format check (Code analysis)
        run: |
          ruff format --check .
          ruff check .

      - name: Run tests with coverage (Unit Test)
        run: pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  fluid-attacks-equivalent:
    name: Fluid Attacks equivalent (Semgrep SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep SAST scan (SARIF)
        run: semgrep scan --config p/ci --sarif --output semgrep.sarif
        continue-on-error: true

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  quality-gate-sonar:
    name: Quality Gate Sonar
    needs: [build-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest

      - name: SonarCloud analysis
        if: vars.SONAR_ORGANIZATION != '' && (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]')
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish-ghcr:
    name: Build image + push to GitHub Container Registry
    needs: [build-test, quality-gate-sonar, fluid-attacks-equivalent]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/devops-swarm-challenge:${{ github.sha }} -t ghcr.io/${{ github.repository_owner }}/devops-swarm-challenge:latest .

      - name: Push image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/devops-swarm-challenge:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/devops-swarm-challenge:latest
