name: Cleanup GHCR

# Every push to main tags a new image with its commit SHA (see ci.yml,
# job publish-ghcr), so ghcr.io accumulates one image per commit forever.
# Storage is free for public repos, but this keeps the package list sane.
# Runs weekly and can also be triggered by hand.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old container image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: devops-swarm-challenge
          package-type: container
          min-versions-to-keep: 10
          ignore-versions: "^latest$"
