name: Deploy

# Mirrors the "Onpremise" half of reto.png: a developer manually triggers this
# (GitHub Free on a private repo doesn't support the "required reviewers"
# environment protection rule - see README - so workflow_dispatch is the stand-in
# approval gate). The self-hosted runner then promotes the image built by CI
# through DMGR1/DMGR2-style Docker Swarm stacks: DEV -> SIT -> QA.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to the latest commit on main)"
        required: false

env:
  # Falls back to a locally-built image when JFrog isn't wired up yet (see README) -
  # stack/deploy.sh itself defaults IMAGE to devops-swarm-challenge:local when unset.
  IMAGE: ${{ vars.JF_DOCKER_REPO != '' && format('{0}/devops-swarm-challenge:{1}', vars.JF_DOCKER_REPO, github.event.inputs.image_tag || github.sha) || '' }}

jobs:
  deploy-dev:
    name: Deploy to DEV
    runs-on: [self-hosted, onprem]
    environment: dev
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build image locally (no Artifactory configured yet)
        if: vars.JF_DOCKER_REPO == ''
        run: docker build -t devops-swarm-challenge:local .
      - run: ./stack/deploy.sh dev

  deploy-sit:
    name: Deploy to SIT
    needs: deploy-dev
    runs-on: [self-hosted, onprem]
    environment: sit
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: ./stack/deploy.sh sit

  deploy-qa:
    name: Deploy to QA
    needs: deploy-sit
    runs-on: [self-hosted, onprem]
    environment: qa
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: ./stack/deploy.sh qa
