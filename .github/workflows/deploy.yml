name: Deploy

# Mirrors the "Onpremise" half of reto.png: a developer manually triggers this,
# and each environment (dev/sit/qa) has a required-reviewers protection rule
# configured on GitHub, so the run pauses for real manual approval before
# each stage. The self-hosted runner then promotes the image built by CI
# through DMGR1/DMGR2-style Docker Swarm stacks: DEV -> SIT -> QA. Each stage
# ends with a smoke test against /health; if it doesn't come up healthy in
# 60s, the job rolls the service back to its previous spec (docker service
# rollback) before failing, instead of leaving a broken image running or
# promoting it to the next environment.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to the latest commit on main)"
        required: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/devops-swarm-challenge:${{ github.event.inputs.image_tag || 'latest' }}

jobs:
  deploy-dev:
    name: Deploy to DEV
    runs-on: [self-hosted, onprem]
    environment: dev
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe -e {0}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Log in to GHCR (self-hosted Docker daemon)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker pull "$IMAGE"
      - run: ./stack/deploy.sh dev
      - name: Smoke test (/health)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/health; then
              echo "dev is healthy"
              exit 0
            fi
            echo "Waiting for dev to become healthy... ($i/30)"
            sleep 2
          done
          echo "dev did not become healthy in time - rolling back" >&2
          docker service rollback devops-swarm-challenge-dev_app --detach=false || echo "rollback failed or nothing to roll back to" >&2
          exit 1

  deploy-sit:
    name: Deploy to SIT
    needs: deploy-dev
    runs-on: [self-hosted, onprem]
    environment: sit
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe -e {0}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Log in to GHCR (self-hosted Docker daemon)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker pull "$IMAGE"
      - run: ./stack/deploy.sh sit
      - name: Smoke test (/health)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8082/health; then
              echo "sit is healthy"
              exit 0
            fi
            echo "Waiting for sit to become healthy... ($i/30)"
            sleep 2
          done
          echo "sit did not become healthy in time - rolling back" >&2
          docker service rollback devops-swarm-challenge-sit_app --detach=false || echo "rollback failed or nothing to roll back to" >&2
          exit 1

  deploy-qa:
    name: Deploy to QA
    needs: deploy-sit
    runs-on: [self-hosted, onprem]
    environment: qa
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe -e {0}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Log in to GHCR (self-hosted Docker daemon)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker pull "$IMAGE"
      - run: ./stack/deploy.sh qa
      - name: Smoke test (/health)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8083/health; then
              echo "qa is healthy"
              exit 0
            fi
            echo "Waiting for qa to become healthy... ($i/30)"
            sleep 2
          done
          echo "qa did not become healthy in time - rolling back" >&2
          docker service rollback devops-swarm-challenge-qa_app --detach=false || echo "rollback failed or nothing to roll back to" >&2
          exit 1
