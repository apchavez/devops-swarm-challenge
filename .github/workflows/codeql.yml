name: CodeQL

# The "GitHub Advanced Security" box in reto.png.
#
# Known real limitation (confirmed 2026-08-21 via `gh api .../code-scanning/alerts`
# -> 403 "Code scanning is not enabled for this repository" and a PATCH attempt to
# enable secret_scanning -> 422 "Secret scanning is not available for this
# repository"): GitHub Advanced Security features are free for PUBLIC repos but
# require a paid plan for PRIVATE repos on personal accounts. Since this challenge
# is deliberately private, the SARIF upload step fails - kept `continue-on-error`
# so the workflow still demonstrates running CodeQL locally in CI. In an org with a
# GHAS license (e.g. Interbank), this would upload findings to the Security tab
# normally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: "/language:python"
