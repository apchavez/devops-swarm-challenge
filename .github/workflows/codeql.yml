name: CodeQL

# The "GitHub Advanced Security" box in reto.png.
#
# Repo made public 2026-08-21 specifically so GHAS runs for real (code scanning +
# secret scanning are free on public repos on any plan). SARIF now uploads to the
# Security tab normally, same as it would in an org with a GHAS license (e.g.
# Interbank).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
